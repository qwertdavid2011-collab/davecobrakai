<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cobra Kai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0c0c;
      --card: #141414;
      --border: rgba(255,255,255,0.08);
      --red: #e10600;
      --yellow: #f9ed31;
      --text: #f0f0f0;
      --muted: #888;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 48px 20px 80px;
    }
    header {
      text-align: center;
      margin-bottom: 48px;
    }
    .logo {
      width: 180px;
      height: auto;
      margin-bottom: 16px;
    }
    .subtitle {
      font-family: 'Oswald', sans-serif;
      font-size: 13px;
      letter-spacing: 2.5px;
      color: var(--yellow);
      text-transform: uppercase;
      opacity: 0.9;
    }
    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .section-title {
      font-family: 'Oswald', sans-serif;
      font-size: 15px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--yellow);
      margin-bottom: 16px;
    }
    .leader {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
    }
    .leader + .leader {
      border-top: 1px solid var(--border);
      margin-top: 8px;
      padding-top: 20px;
    }
    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--red);
    }
    .name {
      font-weight: 600;
      font-size: 16px;
    }
    .role {
      font-size: 13px;
      color: var(--muted);
      margin: 2px 0 8px;
    }
    .discord {
      display: inline-block;
      background: #5865F2;
      color: white;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
    }
    .games {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .game {
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .game img {
      width: 100%;
      height: 100px;
      object-fit: cover;
    }
    .game-name {
      padding: 10px 8px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
    }
    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 12px;
      color: var(--muted);
    }
    .now-playing {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="cobra-kai-logo.jpg" alt="Cobra Kai" class="logo">
      <div class="subtitle">Strike First · Strike Hard · No Mercy</div>
    </header>

    <div class="section">
      <div class="section-title">Liderstwo</div>
      <div class="leader">
        <img src="https://r2.guns.lol/7b164cdc-af3c-468c-bbf3-730956cb912a.webp" class="avatar" alt=".DaVe">
        <div>
          <div class="name">.DaVe</div>
          <div class="role">Lider · Boss Szarej Strefy</div>
          <a href="https://discord.com/users/your-id" class="discord" target="_blank">Discord</a>
        </div>
      </div>
      <div class="leader">
        <img src="https://cdn.discordapp.com/embed/avatars/0.png" class="avatar" alt="Lider" style="background:#5865F2;">
        <div>
          <div class="name">Drugi Lider</div>
          <div class="role">Lider</div>
          <a href="https://discord.com/users/334720799485329418" class="discord" target="_blank">Discord</a>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Gry</div>
      <div class="games">
        <div class="game">
          <img src="https://images.igdb.com/igdb/image/upload/t_cover_big/cocrs8.jpg" alt="Arena Breakout Infinite">
          <div class="game-name">Arena Breakout Infinite</div>
        </div>
        <div class="game">
          <img src="https://upload.wikimedia.org/wikipedia/commons/8/8a/FiveM-Logo.png" alt="FiveM">
          <div class="game-name">FiveM</div>
        </div>
      </div>
    </div>

    <div class="now-playing">Eye of the Tiger · gra w tle</div>

    <footer>Cobra Kai · Szara Strefa</footer>
  </div>

  <audio id="tiger" autoplay loop>
    <source src="eye-of-the-tiger.mp3" type="audio/mpeg">
  </audio>
  <script>
    const a = document.getElementById('tiger');
    a.play().catch(() => {
      document.body.addEventListener('click', () => a.play(), { once: true });
    });
  </script>
</body>
</html>
